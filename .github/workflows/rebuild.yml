name: Rebuild site when KB content changes

# Polls PocketBase every ~10 min. If an article changed since the last build,
# pushes a marker commit AUTHORED as ricky@kimbledigital.com. Vercel's git
# integration then builds it. (This only works once that email is verified on
# the GitHub account — otherwise Vercel Hobby blocks the deploy.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kb-rebuild
  cancel-in-progress: false

env:
  PB_URL: https://synel-kb-kimble.fly.dev

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # push so it can commit back

      - name: Rebuild if PocketBase content changed
        run: |
          set -e
          LATEST=$(curl -s "$PB_URL/api/collections/articles/records?perPage=1&sort=-updated" \
            | python3 -c "import sys,json; print((json.load(sys.stdin).get('items') or [{}])[0].get('updated',''))")
          PREV=$(cat .last-kb-sync 2>/dev/null || echo "")
          echo "latest in PocketBase: '$LATEST' | last built: '$PREV'"
          if [ -z "$LATEST" ]; then echo "PocketBase unreachable; skipping."; exit 0; fi
          if [ "$LATEST" = "$PREV" ]; then echo "No change; nothing to do."; exit 0; fi
          printf '%s' "$LATEST" > .last-kb-sync
          git config user.name  "Synel KB (auto)"
          git config user.email "ricky@kimbledigital.com"
          git add .last-kb-sync
          git commit -m "chore: KB content updated — rebuild"
          git push
