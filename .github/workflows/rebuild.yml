name: Rebuild site when KB content changes

# Polls PocketBase every ~10 minutes. If any article changed since the last
# build, pushes an empty/marker commit which triggers a Vercel deploy.
#
# IMPORTANT: Vercel's free (Hobby) plan only builds commits pushed by the
# account owner — not github-actions[bot]. So we push using your personal
# token (repo secret GH_PAT) and author the commit as your GitHub user, so
# Vercel attributes the deploy to you and builds it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kb-rebuild
  cancel-in-progress: false

env:
  PB_URL: https://synel-kb-kimble.fly.dev

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # push as YOU, not the bot

      - name: Rebuild if PocketBase content changed
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          LATEST=$(curl -s "$PB_URL/api/collections/articles/records?perPage=1&sort=-updated" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('items') or [{}])[0].get('updated',''))")
          PREV=$(cat .last-kb-sync 2>/dev/null || echo "")
          echo "latest in PocketBase: '$LATEST'  | last built: '$PREV'"
          if [ -z "$LATEST" ]; then
            echo "Could not read PocketBase (it may be momentarily down); skipping this run."
            exit 0
          fi
          if [ "$LATEST" = "$PREV" ]; then
            echo "No change since last build — nothing to do."
            exit 0
          fi
          echo "Change detected — triggering a rebuild."
          # author the commit as the token owner (you) so Vercel will build it
          WHO=$(curl -s -H "Authorization: Bearer $GH_PAT" https://api.github.com/user)
          LOGIN=$(echo "$WHO" | python3 -c "import sys,json;print(json.load(sys.stdin).get('login',''))")
          UID_=$(echo "$WHO"  | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          git config user.name  "${LOGIN:-synel-kb}"
          git config user.email "${UID_}+${LOGIN}@users.noreply.github.com"
          echo "$LATEST" > .last-kb-sync
          git add .last-kb-sync
          git commit -m "chore: KB content updated — rebuild"
          git push
