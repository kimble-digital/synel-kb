name: Scheduled KB rebuild (twice daily)

# Rebuilds the site on a schedule so edits made in PocketBase go live.
# The rebuild is triggered by a Vercel Deploy Hook (GitHub secret
# VERCEL_DEPLOY_HOOK, created in Vercel > synel-kb > Settings > Git > Deploy
# Hooks). Vercel then pulls main and builds it exactly as it does for a push.
# Pushes to main are deployed by Vercel's git integration directly, so this
# workflow only runs on schedule or manual trigger.
#
# IMPORTANT: GitHub silently disables scheduled workflows after 60 days with no
# repo activity (this is what stopped deploys from 27 Sep 2026). The keepalive
# step calls the "enable workflow" API on this workflow at every run, which
# resets that 60-day counter without needing dummy commits.
on:
  schedule:
    - cron: "0 7,15 * * *"   # twice a day: 07:00 and 15:00 UTC (~8am & 4pm UK)
  workflow_dispatch:

concurrency:
  group: kb-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # needed by the keepalive step

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive (reset GitHub's 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/rebuild.yml/enable"

      - name: Trigger Vercel production rebuild via Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set. Create a Deploy Hook in Vercel (synel-kb > Settings > Git) and add its URL as a repository secret."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo
          echo "Rebuild requested. Check https://vercel.com/rickys-projects-e974cf7d/synel-kb/deployments"
